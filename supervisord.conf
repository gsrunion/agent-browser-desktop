[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:display]
command=Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true

[program:window-manager]
command=/bin/sh -c 'while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 1; done; exec openbox'
priority=20
autorestart=true

[program:vnc]
command=/bin/sh -c 'while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 1; done; exec x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -listen 0.0.0.0 -noxdamage -noxfixes -noxrecord -noshm -threads'
priority=30
autorestart=true

[program:chromium]
command=/bin/sh -c 'while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 1; done; exec chromium --no-sandbox --disable-dev-shm-usage --ozone-platform=x11 --no-first-run --no-default-browser-check --password-store=basic --user-data-dir=/profile --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 --window-size=1440,900 --restore-last-session'
priority=40
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

[program:cdp-proxy]
command=socat TCP-LISTEN:9222,fork,reuseaddr,bind=127.0.0.1 TCP:127.0.0.1:9223
priority=50
autorestart=true

[program:mcp]
command=/bin/sh -c 'until curl -fsS http://127.0.0.1:9222/json/version >/dev/null; do sleep 1; done; exec /opt/mcp/node_modules/.bin/supergateway --stdio "node /opt/mcp/mcp-filter.mjs" --outputTransport streamableHttp --port 8000 --host 0.0.0.0'
priority=60
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
